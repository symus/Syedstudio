spring:
  datasource:
    url: ${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/craftora_test}
    username: ${TEST_DATABASE_USERNAME:craftora}
    password: ${TEST_DATABASE_PASSWORD:craftora}
  flyway:
    clean-disabled: false

app:
  mail:
    mode: log
  storage:
    provider: local
    local-root: ./target/test-uploads
  rate-limit:
    auth-per-minute: 1000
    public-forms-per-hour: 1000
  bootstrap:
    admin-email: ""
    admin-password: ""
