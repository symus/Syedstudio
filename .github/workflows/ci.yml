name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: craftora_test
          POSTGRES_USER: craftora
          POSTGRES_PASSWORD: craftora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U craftora" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: "1" }

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: craftora
          POSTGRES_USER: craftora
          POSTGRES_PASSWORD: craftora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U craftora" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Start backend
        working-directory: backend
        env:
          APP_DEV_OUTBOX: "true"
          APP_ADMIN_EMAIL: admin@craftora.local
          APP_ADMIN_PASSWORD: admin-password-123
        run: |
          mvn -B -q -DskipTests package
          nohup java -jar target/craftora-backend-*.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health && break; sleep 2; done
      - name: Build and start frontend
        working-directory: frontend
        env: { NEXT_TELEMETRY_DISABLED: "1" }
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          nohup npx next start -p 3000 > frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null localhost:3000 && break; sleep 2; done
      - run: npm run test:e2e
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            frontend/test-results
            backend/backend.log
            frontend/frontend.log
